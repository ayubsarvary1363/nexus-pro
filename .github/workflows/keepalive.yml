name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the trading server
        env:
          NEXUS_URL: https://nexus-pro-shxd.onrender.com/healthz
        run: |
          echo "URL: $NEXUS_URL"
          for i in 1 2; do
            echo "-- try $i --"
            CODE=$(curl -sS -m 90 -o /tmp/out.json -w "%{http_code}" "$NEXUS_URL" || echo "000")
            echo "HTTP: $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/out.json; echo ""
              if grep -q '"ok":true' /tmp/out.json; then
                echo "OK - server is awake"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "WARN - no answer (asleep or deploying)"
          exit 0
